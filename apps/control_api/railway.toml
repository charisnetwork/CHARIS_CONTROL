# Works whether the Railway service root is the repo root (uses ./Dockerfile) or
# apps/control_api (uses apps/control_api/railway.toml and its Dockerfile).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "python -m alembic upgrade head"
# Explicit, so an old start command left in the Railway dashboard (e.g. from the
# former Node service) can never be used. The shell expands Railway's $PORT.
startCommand = "sh -c 'exec python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

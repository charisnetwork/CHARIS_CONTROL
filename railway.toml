[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/control_api/Dockerfile"

[deploy]
preDeployCommand = "/usr/local/bin/python -m alembic upgrade head"
startCommand = "/usr/local/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
